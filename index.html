    background-size: cover, cover, cover;
    background-position: center, center, center;
    background-attachment: fixed, fixed, fixed;
    background-repeat: no-repeat, no-repeat, repeat;
    min-height:100vh;
    padding-bottom:110px;
  }

  /* ---------- Header ---------- */
  header{
    text-align:center;
    padding:38px 20px 22px;
    position:relative;
  }
  .brand-box{
    display:inline-block;
    border:2px solid var(--ink);
    padding:14px 34px;
    position:relative;
  }
  .brand-box::before{
    content:"";
    position:absolute; left:-14%; top:38%;
    width:128%; height:4px;
    background:var(--red);
    transform:rotate(-8deg);
  }
  .brand-title{
    font-family:'Archivo Black', sans-serif;
    font-style:italic;
    font-size:clamp(28px,6vw,44px);
    letter-spacing:2px;
    line-height:1.05;
    margin:0;
  }
  .brand-sub{
    margin-top:10px;
    font-family:'Barlow Condensed', sans-serif;
    text-transform:uppercase;
    letter-spacing:6px;
    color:var(--ink-dim);
    font-size:12px;
  }
  .phone-line{
    margin-top:10px;
    font-family:'Barlow Condensed', sans-serif;
    letter-spacing:2px;
    color:var(--gold);
    font-size:14px;
  }

  /* ---------- Tabs ---------- */
  nav.tabs{
    position:sticky; top:0; z-index:50;
    display:flex; gap:0;
    overflow-x:auto;
    background:rgba(8,8,9,0.86);
    backdrop-filter: blur(10px);
    border-top:1px solid var(--card-line);
    border-bottom:1px solid var(--card-line);
    scrollbar-width:none;
  }
  nav.tabs::-webkit-scrollbar{ display:none; }
  nav.tabs button{
    flex:0 0 auto;
    background:transparent;
    border:none;
    color:var(--ink-dim);
    font-family:'Barlow Condensed', sans-serif;
    text-transform:uppercase;
    letter-spacing:2px;
    font-size:14px;
    padding:16px 18px;
    cursor:pointer;
    position:relative;
    white-space:nowrap;
    transition:color .2s;
  }
  nav.tabs button.active{ color:var(--ink); }
  nav.tabs button.active::after{
    content:"";
    position:absolute; left:16px; right:16px; bottom:0;
    height:3px; background:var(--red);
  }

  main{ max-width:900px; margin:0 auto; padding:26px 16px 40px; }

  .section-label{
    display:inline-block;
    background:linear-gradient(90deg, var(--red-dark), var(--red));
    color:#fff;
    font-family:'Archivo Black', sans-serif;
    font-style:italic;
    letter-spacing:2px;
    padding:9px 22px;
    font-size:20px;
    margin:34px 0 6px;
    clip-path: polygon(0 0, 100% 0, 96% 100%, 0% 100%);
  }
  .section-label:first-of-type{ margin-top:6px; }

  .subgroup-label{
    font-family:'Barlow Condensed', sans-serif;
    font-style:italic;
    font-weight:700;
    color:var(--red);
    text-transform:uppercase;
    letter-spacing:4px;
    font-size:15px;
    margin:26px 2px 12px;
    padding-bottom:6px;
    border-bottom:1px solid var(--card-line);
  }

  .grid{
    display:grid;
    grid-template-columns:1fr;
    gap:12px;
  }
  @media(min-width:640px){
    .grid{ grid-template-columns:1fr 1fr; }
  }

  .item{
    background:var(--card);
    border:1px solid var(--card-line);
    border-radius:10px;
    padding:14px 14px 12px;
    display:flex;
    gap:12px;
    align-items:flex-start;
  }
  .item-icon{
    flex:0 0 auto;
    width:46px; height:46px;
    border-radius:50%;
    border:1px solid rgba(207,161,94,0.5);
    display:flex; align-items:center; justify-content:center;
    font-size:20px;
    background:radial-gradient(circle at 35% 30%, rgba(216,19,36,0.18), rgba(255,255,255,0.02));
  }
  .item-body{ flex:1; min-width:0; }
  .item-top{
    display:flex; justify-content:space-between; gap:10px; align-items:baseline;
  }
  .item-name{
    font-family:'Barlow Condensed', sans-serif;
    font-style:italic;
    font-weight:700;
    letter-spacing:0.5px;
    font-size:16.5px;
    text-transform:uppercase;
  }
  .item-price{
    font-family:'Archivo Black', sans-serif;
    color:var(--gold);
    font-size:15px;
    white-space:nowrap;
  }
  .item-desc{
    color:var(--ink-dim);
    font-size:12.8px;
    line-height:1.4;
    margin-top:3px;
    font-style:italic;
  }
  .item-controls{
    display:flex; align-items:center; justify-content:space-between;
    margin-top:10px; gap:8px; flex-wrap:wrap;
  }
  select.variant{
    background:#111014;
    color:var(--ink);
    border:1px solid var(--card-line);
    border-radius:6px;

/* ======================= STATE ======================= */

/* ======================= RENDER TABS ======================= */

/* ======================= RENDER MAIN ======================= */
const mainEl = document.getElementById('main');
function renderMain(){
  const section = menu[activeTab];

  secTitle.className = 'section-label';
  secTitle.textContent = section.cat;
  mainEl.appendChild(secTitle);

    mainEl.appendChild(promo);
  }

  section.groups.forEach(group => {

      const g = document.createElement('div');
      g.className = 'subgroup-label';
      g.textContent = group.name;

    }

    grid.className = 'grid';

function renderItem(item){
  const div = document.createElement('div');
  div.className = 'item';

  const priceLabel = item.variants
    ? `$${Math.min(...item.variants.map(v=>v[1]))}+`
    : `$${item.price}`;

  div.innerHTML = `
    <div class="item-icon">${item.icon || '🍣'}</div>
    <div class="item-body">
      <div class="item-top">
        <div class="item-name">${item.name}</div>
        <div class="item-price">${priceLabel}${item.rollo ? '<span class="promo-badge">2X1</span>' : ''}</div>
      </div>
      ${item.desc ? `<div class="item-desc">${item.desc}</div>` : ''}
      <div class="item-controls">
        ${item.variants ? `<select class="variant"></select>` : ''}
        <button class="addbtn">Agregar</button>
      </div>
    </div>
  `;

  const select = div.querySelector('select.variant');
  if(item.variants && select){
    const placeholder = document.createElement('option');
    placeholder.value = '';
    placeholder.textContent = 'Seleccionar...';
    placeholder.disabled = true;
    placeholder.selected = true;
    select.appendChild(placeholder);
    item.variants.forEach(([label, price]) => {
      const opt = document.createElement('option');
      opt.value = label;
      opt.dataset.price = price;
      opt.textContent = `${label} — $${price}`;
      select.appendChild(opt);
    });
  }

  const btn = div.querySelector('.addbtn');
  btn.onclick = () => {
    let variantLabel = null, price = item.price;
    if(item.variants && select){
      if(!select.value){
        select.classList.add('variant-error');
        select.focus();
        setTimeout(() => select.classList.remove('variant-error'), 1200);
        return;
      }
      const opt = select.options[select.selectedIndex];
      variantLabel = opt.value;
      price = Number(opt.dataset.price);
    }
    addToCart(item.id, item.name, variantLabel, price, !!item.rollo);
    btn.textContent = 'Agregado ✓';
    btn.classList.add('added');
    setTimeout(()=>{ btn.textContent='Agregar'; btn.classList.remove('added'); }, 900);
  };

  return div;
}

/* ======================= CART LOGIC ======================= */
function addToCart(id, name, variant, price, rollo){
  const key = id + '::' + (variant || '');
  const existing = cart.find(c => c.key === key);
  if(existing){ existing.qty += 1; }
  else{ cart.push({ key, name, variant, price, qty:1, rollo: !!rollo }); }
  renderCart();
}
function changeQty(key, delta){
  const line = cart.find(c => c.key === key);
  if(!line) return;
  line.qty += delta;
  if(line.qty <= 0) cart = cart.filter(c => c.key !== key);
  renderCart();
}
function removeLine(key){
  cart = cart.filter(c => c.key !== key);
  renderCart();
}
function cartSubtotal(){
  return cart.reduce((sum, c) => sum + c.price * c.qty, 0);
}
function cartCount(){
  return cart.reduce((sum, c) => sum + c.qty, 0);
}
/* Promo 2x1 en Rollos: se expande cada unidad de rollo del carrito, se ordena de menor a
   mayor precio y se empareja el más barato con el más caro (extremos hacia el centro).
   En cada par se cobra el de mayor precio y el de menor precio del par sale gratis.
   Si sobra una unidad sin pareja, esa se cobra completa. */
function rolloDiscount(){
  let units = [];
  cart.forEach(line => { if(line.rollo){ for(let i=0;i<line.qty;i++) units.push(line.price); } });
  units.sort((a,b) => a - b);
  let discount = 0;
  let lo = 0, hi = units.length - 1;
  while(lo < hi){
    discount += units[lo]; // el más barato del par sale gratis
    lo++; hi--;
  }
  return discount;
}
function cartTotal(){
  return cartSubtotal() - rolloDiscount();
}

const drawerItemsEl = document.getElementById('drawerItems');
const cartCountEl = document.getElementById('cartCount');
const totalAmountEl = document.getElementById('totalAmount');

function renderCart(){
  cartCountEl.textContent = cartCount();
  totalAmountEl.textContent = '$' + cartTotal();

  if(cart.length === 0){
    drawerItemsEl.innerHTML = `<div class="drawer-empty">Tu pedido está vacío.<br>Agrega productos del menú.</div>`;
    return;
  }
  drawerItemsEl.innerHTML = '';
  cart.forEach(line => {
    const el = document.createElement('div');
    el.className = 'cart-line';
    el.innerHTML = `
      <div>
        <div class="cart-line-name">${line.name}${line.rollo ? '<span class="promo-badge">2X1</span>' : ''}</div>
        ${line.variant ? `<div class="cart-line-variant">${line.variant}</div>` : ''}
        <div class="cart-line-qty">
          <button class="qtybtn minus">−</button>
          <span>${line.qty}</span>
          <button class="qtybtn plus">+</button>
        </div>
      </div>
      <div class="cart-line-right">
        $${line.price * line.qty}
        <div class="rm">Quitar</div>
      </div>
    `;
    el.querySelector('.plus').onclick = () => changeQty(line.key, 1);
    el.querySelector('.minus').onclick = () => changeQty(line.key, -1);
    el.querySelector('.rm').onclick = () => removeLine(line.key);
    drawerItemsEl.appendChild(el);
  });

  const discount = rolloDiscount();
  if(discount > 0){
    const dline = document.createElement('div');
    dline.className = 'discount-line';
    dline.innerHTML = `<span>Descuento 2X1 en rollos</span><span>−$${discount}</span>`;
    drawerItemsEl.appendChild(dline);
  }
}

/* ======================= STORAGE (con respaldo en localStorage) ======================= */
async function storageGet(key){
  try{
    if(window.storage){
      const r = await window.storage.get(key);
      return r ? JSON.parse(r.value) : null;
    }
  }catch(e){ /* clave no existe todavía */ }
  try{
    const v = localStorage.getItem(key);
    return v ? JSON.parse(v) : null;
  }catch(e){ return null; }
}
async function storageSet(key, value){
  try{
    if(window.storage){
      await window.storage.set(key, JSON.stringify(value));
      return;
    }
  }catch(e){ /* sigue con fallback */ }
  try{ localStorage.setItem(key, JSON.stringify(value)); }catch(e){ /* noop */ }
}

/* ======================= FOLIO ======================= */
const MESES = ["ENE","FEB","MAR","ABR","MAY","JUN","JUL","AGO","SEP","OCT","NOV","DIC"];
async function nextFolio(){
  let counter = await storageGet('hikarii:folio-counter');
  if(!counter || typeof counter !== 'number') counter = 0;
  counter += 1;
  await storageSet('hikarii:folio-counter', counter);
  const now = new Date();
  const mes = MESES[now.getMonth()];
  const yy = String(now.getFullYear()).slice(-2);
  return String(counter).padStart(3,'0') + mes + yy;
}

/* ======================= GUARDAR PEDIDOS (para el panel de ingresos) ======================= */
async function saveOrder(order){
  let orders = await storageGet('hikarii:orders');
  if(!Array.isArray(orders)) orders = [];
  orders.push(order);
  await storageSet('hikarii:orders', orders);
}

/* ======================= WHATSAPP SEND ======================= */
document.getElementById('sendWA').onclick = async () => {
  if(cart.length === 0){ alert('Tu pedido está vacío. Agrega al menos un producto.'); return; }

  const btn = document.getElementById('sendWA');
  btn.disabled = true;
  const originalText = btn.innerHTML;
  btn.innerHTML = 'Generando folio...';

  const name = document.getElementById('custName').value.trim();
  const deliveryType = document.getElementById('deliveryType').value;
  const address = document.getElementById('address').value.trim();
  const paymentMethod = document.getElementById('paymentMethod').value;
  const notes = document.getElementById('notes').value.trim();
  const discount = rolloDiscount();
  const total = cartTotal();

  const folio = await nextFolio();

  let msg = `¡Hola Hikarii Sushi! 🍣 Quiero hacer el siguiente pedido:\n`;
  msg += `Folio: *${folio}*\n\n`;
  cart.forEach(line => {
    msg += `• ${line.qty}x ${line.name}`;
    if(line.variant) msg += ` (${line.variant})`;
    if(line.rollo) msg += ` [2X1]`;
    msg += ` — $${line.price * line.qty}\n`;
  });
  if(discount > 0) msg += `\nDescuento 2X1 en rollos: −$${discount}\n`;
  msg += `\n*Total: $${total}*\n\n`;
  if(name) msg += `Nombre: ${name}\n`;
  msg += `Entrega: ${deliveryType}\n`;
  if(deliveryType === 'Entrega a domicilio' && address) msg += `Dirección: ${address}\n`;
  msg += `Método de pago: ${paymentMethod}\n`;
  if(notes) msg += `Notas: ${notes}\n`;

  await saveOrder({
    folio,
    timestamp: new Date().toISOString(),
    customer: name || '(sin nombre)',
    delivery: deliveryType,
    address,
    paymentMethod,
    notes,
    items: cart.map(c => ({ name:c.name, variant:c.variant, price:c.price, qty:c.qty, rollo:c.rollo })),
    discount,
    total
  });

  const url = `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(msg)}`;
  window.open(url, '_blank');

  btn.disabled = false;
  btn.innerHTML = originalText;
};

async function renderAdminPanel(){
  const orders = (await storageGet('hikarii:orders')) || [];
  const totalRevenue = orders.reduce((s,o) => s + o.total, 0);
  const today = new Date().toDateString();
  const todayRevenue = orders.filter(o => new Date(o.timestamp).toDateString() === today)
                              .reduce((s,o) => s + o.total, 0);

  document.getElementById('adminSummary').innerHTML = `
    <div class="admin-stat"><b>$${totalRevenue}</b>Ingresos totales</div>
    <div class="admin-stat"><b>$${todayRevenue}</b>Ingresos de hoy</div>
    <div class="admin-stat"><b>${orders.length}</b>Pedidos registrados</div>
  `;

  const tbody = document.getElementById('adminTableBody');
  if(orders.length === 0){
    tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; color:var(--ink-dim); padding:24px;">Aún no hay pedidos guardados.</td></tr>`;
  }else{
    tbody.innerHTML = orders.slice().reverse().map(o => {
      const d = new Date(o.timestamp);
      const fecha = d.toLocaleDateString('es-MX') + ' ' + d.toLocaleTimeString('es-MX', {hour:'2-digit', minute:'2-digit'});
      const itemsResumen = o.items.map(i => `${i.qty}x ${i.name}${i.variant ? ' ('+i.variant+')' : ''}`).join(', ');
      return `<tr>
        <td>${o.folio}</td>
        <td>${fecha}</td>
        <td>${o.customer}</td>
        <td>${itemsResumen}</td>
        <td>${o.paymentMethod || '—'}</td>
        <td>$${o.total}</td>
      </tr>`;
    }).join('');
  }
}

  await storageSet('hikarii:orders', []);
  await renderAdminPanel();
};
