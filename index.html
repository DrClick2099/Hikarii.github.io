<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hikarii Sushi — Menú</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Archivo+Black&family=Barlow+Condensed:ital,wght@0,400;0,500;0,600;1,700&family=Barlow:ital,wght@0,400;0,500;0,600;1,600&display=swap');

  :root{
    --red: #d81324;
    --red-dark: #8f0c17;
    --gold: #cfa15e;
    --ink: #f2eee7;
    --ink-dim: #b9b4ab;
    --card: rgba(255,255,255,0.035);
    --card-line: rgba(255,255,255,0.09);
    --marble-1: #0a0a0b;
    --marble-2: #17161a;
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; }

  body{
    font-family:'Barlow', sans-serif;
    color:var(--ink);
    background:
      radial-gradient(ellipse at 15% 0%, rgba(216,19,36,0.10), transparent 45%),
      radial-gradient(ellipse at 85% 30%, rgba(255,255,255,0.05), transparent 40%),
      repeating-linear-gradient(115deg, rgba(255,255,255,0.015) 0px, rgba(255,255,255,0.015) 1px, transparent 1px, transparent 90px),
      repeating-linear-gradient(25deg, rgba(255,255,255,0.02) 0px, rgba(255,255,255,0.02) 2px, transparent 2px, transparent 140px),
      linear-gradient(160deg, var(--marble-1), var(--marble-2) 55%, #0d0c0e);
    min-height:100vh;
    padding-bottom:110px;
  }

  /* ---------- Header ---------- */
  header{
    text-align:center;
    padding:38px 20px 22px;
    position:relative;
  }
  .brand-box{
    display:inline-block;
    border:2px solid var(--ink);
    padding:14px 34px;
    position:relative;
  }
  .brand-box::before{
    content:"";
    position:absolute; left:-14%; top:38%;
    width:128%; height:4px;
    background:var(--red);
    transform:rotate(-8deg);
  }
  .brand-title{
    font-family:'Archivo Black', sans-serif;
    font-style:italic;
    font-size:clamp(28px,6vw,44px);
    letter-spacing:2px;
    line-height:1.05;
    margin:0;
  }
  .brand-sub{
    margin-top:10px;
    font-family:'Barlow Condensed', sans-serif;
    text-transform:uppercase;
    letter-spacing:6px;
    color:var(--ink-dim);
    font-size:12px;
  }
  .phone-line{
    margin-top:10px;
    font-family:'Barlow Condensed', sans-serif;
    letter-spacing:2px;
    color:var(--gold);
    font-size:14px;
  }

  /* ---------- Tabs ---------- */
  nav.tabs{
    position:sticky; top:0; z-index:50;
    display:flex; gap:0;
    overflow-x:auto;
    background:rgba(8,8,9,0.86);
    backdrop-filter: blur(10px);
    border-top:1px solid var(--card-line);
    border-bottom:1px solid var(--card-line);
    scrollbar-width:none;
  }
  nav.tabs::-webkit-scrollbar{ display:none; }
  nav.tabs button{
    flex:0 0 auto;
    background:transparent;
    border:none;
    color:var(--ink-dim);
    font-family:'Barlow Condensed', sans-serif;
    text-transform:uppercase;
    letter-spacing:2px;
    font-size:14px;
    padding:16px 18px;
    cursor:pointer;
    position:relative;
    white-space:nowrap;
    transition:color .2s;
  }
  nav.tabs button.active{ color:var(--ink); }
  nav.tabs button.active::after{
    content:"";
    position:absolute; left:16px; right:16px; bottom:0;
    height:3px; background:var(--red);
  }

  main{ max-width:900px; margin:0 auto; padding:26px 16px 40px; }

  .section-label{
    display:inline-block;
    background:linear-gradient(90deg, var(--red-dark), var(--red));
    color:#fff;
    font-family:'Archivo Black', sans-serif;
    font-style:italic;
    letter-spacing:2px;
    padding:9px 22px;
    font-size:20px;
    margin:34px 0 6px;
    clip-path: polygon(0 0, 100% 0, 96% 100%, 0% 100%);
  }
  .section-label:first-of-type{ margin-top:6px; }

  .subgroup-label{
    font-family:'Barlow Condensed', sans-serif;
    font-style:italic;
    font-weight:700;
    color:var(--red);
    text-transform:uppercase;
    letter-spacing:4px;
    font-size:15px;
    margin:26px 2px 12px;
    padding-bottom:6px;
    border-bottom:1px solid var(--card-line);
  }

  .grid{
    display:grid;
    grid-template-columns:1fr;
    gap:12px;
  }
  @media(min-width:640px){
    .grid{ grid-template-columns:1fr 1fr; }
  }

  .item{
    background:var(--card);
    border:1px solid var(--card-line);
    border-radius:10px;
    padding:14px 14px 12px;
    display:flex;
    gap:12px;
    align-items:flex-start;
  }
  .item-icon{
    flex:0 0 auto;
    width:46px; height:46px;
    border-radius:50%;
    border:1px solid rgba(207,161,94,0.5);
    display:flex; align-items:center; justify-content:center;
    font-size:20px;
    background:radial-gradient(circle at 35% 30%, rgba(216,19,36,0.18), rgba(255,255,255,0.02));
  }
  .item-body{ flex:1; min-width:0; }
  .item-top{
    display:flex; justify-content:space-between; gap:10px; align-items:baseline;
  }
  .item-name{
    font-family:'Barlow Condensed', sans-serif;
    font-style:italic;
    font-weight:700;
    letter-spacing:0.5px;
    font-size:16.5px;
    text-transform:uppercase;
  }
  .item-price{
    font-family:'Archivo Black', sans-serif;
    color:var(--gold);
    font-size:15px;
    white-space:nowrap;
  }
  .item-desc{
    color:var(--ink-dim);
    font-size:12.8px;
    line-height:1.4;
    margin-top:3px;
    font-style:italic;
  }
  .item-controls{
    display:flex; align-items:center; justify-content:space-between;
    margin-top:10px; gap:8px; flex-wrap:wrap;
  }
  select.variant{
    background:#111014;
    color:var(--ink);
    border:1px solid var(--card-line);
    border-radius:6px;
    padding:6px 8px;
    font-family:'Barlow', sans-serif;
    font-size:12.5px;
    flex:1;
    min-width:110px;
  }
  .addbtn{
    background:var(--red);
    color:#fff;
    border:none;
    border-radius:6px;
    padding:7px 14px;
    font-family:'Barlow Condensed', sans-serif;
    letter-spacing:1.5px;
    text-transform:uppercase;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
    transition:background .15s, transform .1s;
    white-space:nowrap;
  }
  .addbtn:active{ transform:scale(0.95); }
  .addbtn:hover{ background:var(--red-dark); }
  .addbtn.added{ background:#2e7d46; }

  .note-box{
    grid-column:1/-1;
    background:rgba(216,19,36,0.07);
    border:1px dashed rgba(216,19,36,0.4);
    border-radius:8px;
    padding:10px 14px;
    font-size:12.5px;
    color:var(--ink-dim);
    font-style:italic;
  }

  /* ---------- Cart ---------- */
  .cart-fab{
    position:fixed; right:18px; bottom:18px; z-index:100;
    background:var(--red);
    color:#fff;
    border:none;
    border-radius:50px;
    padding:14px 20px;
    font-family:'Barlow Condensed', sans-serif;
    font-size:16px;
    letter-spacing:1px;
    text-transform:uppercase;
    font-weight:600;
    display:flex; align-items:center; gap:10px;
    box-shadow:0 6px 24px rgba(216,19,36,0.45);
    cursor:pointer;
  }
  .cart-fab .count{
    background:#fff; color:var(--red-dark);
    border-radius:50%;
    width:24px; height:24px;
    display:flex; align-items:center; justify-content:center;
    font-family:'Archivo Black', sans-serif;
    font-size:12px;
  }

  .drawer-overlay{
    position:fixed; inset:0; background:rgba(0,0,0,0.6);
    z-index:200; opacity:0; pointer-events:none; transition:opacity .25s;
  }
  .drawer-overlay.open{ opacity:1; pointer-events:auto; }

  .drawer{
    position:fixed; right:0; top:0; bottom:0;
    width:min(420px, 92vw);
    background:linear-gradient(170deg, #131215, #0b0a0c);
    border-left:1px solid var(--card-line);
    z-index:201;
    transform:translateX(100%);
    transition:transform .3s ease;
    display:flex; flex-direction:column;
  }
  .drawer.open{ transform:translateX(0); }
  .drawer-head{
    padding:20px; border-bottom:1px solid var(--card-line);
    display:flex; justify-content:space-between; align-items:center;
  }
  .drawer-head h2{
    font-family:'Archivo Black', sans-serif; font-style:italic;
    font-size:20px; margin:0;
  }
  .drawer-head button{
    background:none; border:none; color:var(--ink); font-size:22px; cursor:pointer;
  }
  .drawer-items{ flex:1; overflow-y:auto; padding:14px 18px; }
  .cart-line{
    display:flex; justify-content:space-between; gap:8px;
    padding:11px 0; border-bottom:1px solid var(--card-line);
  }
  .cart-line-name{ font-family:'Barlow Condensed', sans-serif; font-style:italic; font-size:15px; }
  .cart-line-variant{ color:var(--ink-dim); font-size:11.5px; }
  .cart-line-qty{ display:flex; align-items:center; gap:8px; margin-top:5px; }
  .qtybtn{
    width:22px; height:22px; border-radius:5px; border:1px solid var(--card-line);
    background:#1a191d; color:var(--ink); cursor:pointer; font-size:14px; line-height:1;
  }
  .cart-line-right{ text-align:right; white-space:nowrap; font-family:'Archivo Black', sans-serif; color:var(--gold); font-size:14px;}
  .rm{ color:#e07070; font-size:11px; cursor:pointer; margin-top:5px; text-decoration:underline; }

  .drawer-empty{ color:var(--ink-dim); text-align:center; padding:60px 20px; font-style:italic; }

  .drawer-foot{
    border-top:1px solid var(--card-line);
    padding:16px 18px 20px;
  }
  .total-row{
    display:flex; justify-content:space-between; align-items:center;
    font-family:'Barlow Condensed', sans-serif; text-transform:uppercase; letter-spacing:2px;
    margin-bottom:12px; font-size:15px;
  }
  .total-row span:last-child{ font-family:'Archivo Black', sans-serif; color:var(--gold); font-size:20px; letter-spacing:0; text-transform:none; }

  input.field, textarea.field{
    width:100%; background:#111014; border:1px solid var(--card-line);
    color:var(--ink); border-radius:7px; padding:9px 11px; font-family:'Barlow', sans-serif;
    font-size:13.5px; margin-bottom:8px;
  }
  label.flabel{ font-size:11px; color:var(--ink-dim); text-transform:uppercase; letter-spacing:1.5px; display:block; margin-bottom:4px;}

  .wa-btn{
    width:100%; background:#25D366; color:#062712; border:none; border-radius:8px;
    padding:13px; font-family:'Barlow Condensed', sans-serif; font-weight:700;
    text-transform:uppercase; letter-spacing:1.5px; font-size:15.5px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; gap:8px;
    margin-top:6px;
  }
  .wa-btn:hover{ background:#1ebe5a; }
  .wa-btn svg{ width:19px; height:19px; }

  footer{
    text-align:center; padding:30px 16px; color:var(--ink-dim); font-size:12px;
  }
</style>
</head>

/* ======================= STATE ======================= */
let cart = []; // {key, name, variant, price, qty}
let activeTab = 0;

/* ======================= RENDER TABS ======================= */
const tabsEl = document.getElementById('tabs');
menu.forEach((section, i) => {
  const btn = document.createElement('button');
  btn.textContent = section.cat;
  if(i===0) btn.classList.add('active');
  btn.onclick = () => { activeTab = i; renderMain(); renderTabs(); window.scrollTo({top:0, behavior:'smooth'}); };
  tabsEl.appendChild(btn);
});
function renderTabs(){
  [...tabsEl.children].forEach((b,i)=> b.classList.toggle('active', i===activeTab));
}

/* ======================= RENDER MAIN ======================= */
const mainEl = document.getElementById('main');
function renderMain(){
  const section = menu[activeTab];
  mainEl.innerHTML = '';
  const secTitle = document.createElement('div');
  secTitle.className = 'section-label';
  secTitle.textContent = section.cat;
  mainEl.appendChild(secTitle);

  section.groups.forEach(group => {
    if(group.name !== section.cat){
      const g = document.createElement('div');
      g.className = 'subgroup-label';
      g.textContent = group.name;
      mainEl.appendChild(g);
    }
    const grid = document.createElement('div');
    grid.className = 'grid';
    group.items.forEach(item => grid.appendChild(renderItem(item)));
    mainEl.appendChild(grid);
  });
}

function renderItem(item){
  const div = document.createElement('div');
  div.className = 'item';

  const priceLabel = item.variants
    ? `$${Math.min(...item.variants.map(v=>v[1]))}+`
    : `$${item.price}`;

  div.innerHTML = `
    <div class="item-icon">${item.icon || '🍣'}</div>
    <div class="item-body">
      <div class="item-top">
        <div class="item-name">${item.name}</div>
        <div class="item-price">${priceLabel}</div>
      </div>
      ${item.desc ? `<div class="item-desc">${item.desc}</div>` : ''}
      <div class="item-controls">
        ${item.variants ? `<select class="variant"></select>` : ''}
        <button class="addbtn">Agregar</button>
      </div>
    </div>
  `;

  const select = div.querySelector('select.variant');
  if(item.variants && select){
    item.variants.forEach(([label, price]) => {
      const opt = document.createElement('option');
      opt.value = label;
      opt.dataset.price = price;
      opt.textContent = `${label} — $${price}`;
      select.appendChild(opt);
    });
  }

  const btn = div.querySelector('.addbtn');
  btn.onclick = () => {
    let variantLabel = null, price = item.price;
    if(item.variants && select){
      const opt = select.options[select.selectedIndex];
      variantLabel = opt.value;
      price = Number(opt.dataset.price);
    }
    addToCart(item.id, item.name, variantLabel, price);
    btn.textContent = 'Agregado ✓';
    btn.classList.add('added');
    setTimeout(()=>{ btn.textContent='Agregar'; btn.classList.remove('added'); }, 900);
  };

  return div;
}

/* ======================= CART LOGIC ======================= */
function addToCart(id, name, variant, price){
  const key = id + '::' + (variant || '');
  const existing = cart.find(c => c.key === key);
  if(existing){ existing.qty += 1; }
  else{ cart.push({ key, name, variant, price, qty:1 }); }
  renderCart();
}
function changeQty(key, delta){
  const line = cart.find(c => c.key === key);
  if(!line) return;
  line.qty += delta;
  if(line.qty <= 0) cart = cart.filter(c => c.key !== key);
  renderCart();
}
function removeLine(key){
  cart = cart.filter(c => c.key !== key);
  renderCart();
}
function cartTotal(){
  return cart.reduce((sum, c) => sum + c.price * c.qty, 0);
}
function cartCount(){
  return cart.reduce((sum, c) => sum + c.qty, 0);
}

const drawerItemsEl = document.getElementById('drawerItems');
const cartCountEl = document.getElementById('cartCount');
const totalAmountEl = document.getElementById('totalAmount');

function renderCart(){
  cartCountEl.textContent = cartCount();
  totalAmountEl.textContent = '$' + cartTotal();

  if(cart.length === 0){
    drawerItemsEl.innerHTML = `<div class="drawer-empty">Tu pedido está vacío.<br>Agrega productos del menú.</div>`;
    return;
  }
  drawerItemsEl.innerHTML = '';
  cart.forEach(line => {
    const el = document.createElement('div');
    el.className = 'cart-line';
    el.innerHTML = `
      <div>
        <div class="cart-line-name">${line.name}</div>
        ${line.variant ? `<div class="cart-line-variant">${line.variant}</div>` : ''}
        <div class="cart-line-qty">
          <button class="qtybtn minus">−</button>
          <span>${line.qty}</span>
          <button class="qtybtn plus">+</button>
        </div>
      </div>
      <div class="cart-line-right">
        $${line.price * line.qty}
        <div class="rm">Quitar</div>
      </div>
    `;
    el.querySelector('.plus').onclick = () => changeQty(line.key, 1);
    el.querySelector('.minus').onclick = () => changeQty(line.key, -1);
    el.querySelector('.rm').onclick = () => removeLine(line.key);
    drawerItemsEl.appendChild(el);
  });
}

/* ======================= DRAWER OPEN/CLOSE ======================= */
const drawer = document.getElementById('drawer');
const overlay = document.getElementById('overlay');
document.getElementById('cartFab').onclick = () => { drawer.classList.add('open'); overlay.classList.add('open'); };
document.getElementById('closeDrawer').onclick = closeDrawer;
overlay.onclick = closeDrawer;
function closeDrawer(){ drawer.classList.remove('open'); overlay.classList.remove('open'); }

/* ======================= WHATSAPP SEND ======================= */
document.getElementById('sendWA').onclick = () => {
  if(cart.length === 0){ alert('Tu pedido está vacío. Agrega al menos un producto.'); return; }

  const name = document.getElementById('custName').value.trim();
  const deliveryType = document.getElementById('deliveryType').value;
  const address = document.getElementById('address').value.trim();
  const notes = document.getElementById('notes').value.trim();

  let msg = `¡Hola Hikarii Sushi! 🍣 Quiero hacer el siguiente pedido:\n\n`;
  cart.forEach(line => {
    msg += `• ${line.qty}x ${line.name}`;
    if(line.variant) msg += ` (${line.variant})`;
    msg += ` — $${line.price * line.qty}\n`;
  });
  msg += `\n*Total: $${cartTotal()}*\n\n`;
  if(name) msg += `Nombre: ${name}\n`;
  msg += `Entrega: ${deliveryType}\n`;
  if(deliveryType === 'Entrega a domicilio' && address) msg += `Dirección: ${address}\n`;
  if(notes) msg += `Notas: ${notes}\n`;

  const url = `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(msg)}`;
  window.open(url, '_blank');
};

renderCart();
